name: PHP checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.2', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, pdo_sqlite, mbstring, curl, simplexml, zip
          coverage: none
      - name: PHP syntax
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Unit tests
        run: |
          php tests/run.php
          php tests/widgets.php
      - name: Widget JavaScript checks
        run: |
          node --check assets/widget-preview.js
          node --check assets/widget-embed.js
          node --check assets/widget-resize.js
          node --check assets/widget-clicks.js
          node tests/widget-scripts.cjs
